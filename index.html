        <button class="rbtn" data-action="calendar"><svg><use href="#i-clock"/></svg><span>Team calendar</span></button>
        <button class="rbtn" data-action="projects" title="Project management — open, edit or delete a project"><svg><use href="#i-portfolio"/></svg><span>Projects</span></button>
        <button class="rbtn" data-action="export"><svg><use href="#i-export"/></svg><span>Export</span></button>
        <button class="rbtn" data-action="colours"><svg><use href="#i-palette"/></svg><span>Colours</span></button>
        <button class="rbtn" data-action="settings"><svg><use href="#i-settings"/></svg><span>Settings</span></button>
      </div>
    </div>
  </div>

  <section class="project-head" id="projectHead">
    <div class="ph-left">
      <h2 id="projectName">project</h2>
      <span class="lead-name" id="leadName"></span>
    </div>
    <button class="dash-toggle" id="dashToggle">
      <svg class="chev"><use href="#i-chevron"/></svg>
      <span>DASHBOARD</span>
      <span class="dash-hint" id="dashHint"></span>
    </button>
    <div class="ribbon-sub merged">
      <div class="segmented" id="zoomButtons">
        <button data-zoom="day">Day</button>
        <button data-zoom="week">Week</button>
        <button data-zoom="month">Month</button>
        <button data-zoom="quarter">Quarter</button>
        <button data-zoom="halfYear">Half year</button>
        <button data-zoom="year">Year</button>
      </div>
      <button class="chip" data-action="today">Today</button>
      <span class="vsep"></span>
      <button class="chip toggle" data-toggle="showLinks"><svg><use href="#i-link"/></svg>Dependencies</button>
      <button class="chip toggle" data-toggle="showCriticalPath"><svg><use href="#i-flag"/></svg>Critical path</button>
      <span class="vsep"></span>
      <button class="icon-btn" data-action="expand-all" title="Expand all"><svg><use href="#i-expand-all"/></svg><span class="sr">Expand all</span></button>
      <button class="icon-btn" data-action="collapse-all" title="Collapse all"><svg><use href="#i-collapse-all"/></svg><span class="sr">Collapse all</span></button>
      <input class="zoom-ratio" id="zoomRatio" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="100%" title="Timeline scale — type a percentage, or Ctrl + wheel over the chart">
      <div class="spacer"></div>
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="Search tasks" autocomplete="off">
      </label>
      <label class="filter" id="resourceFilterWrap" title="Filter the outline by resource">
        <svg><use href="#i-users"/></svg>
        <select id="resourceFilter">
          <option value="">All resources</option>
        </select>
      </label>
      <label class="filter">
        <svg><use href="#i-filter"/></svg>
        <select id="filterSelect">
          <option value="all">All tasks</option>
          <option value="incomplete">Incomplete</option>
          <option value="complete">Complete</option>
          <option value="milestones">Milestones</option>
          <option value="critical">Critical</option>
          <option value="late">Late</option>
        </select>
      </label>
    </div>
    <div class="ph-right">
      <span id="projectDates">Starts — &nbsp;·&nbsp; Finishes —</span>
      <button class="icon-btn light" data-action="project-edit" title="Edit project"><svg><use href="#i-pencil"/></svg></button>
    </div>
  </section>

  <section class="dashboard" id="dashboard">
    <div class="dash-body" id="dashBody"></div>
  </section>

  <main class="planner" id="planner">
    <section class="task-pane" id="taskPane">
      <div class="task-head" id="taskHead"></div>
      <div class="task-rows" id="taskRows" tabindex="0"></div>
    </section>
    <div class="pane-splitter" id="splitter" title="Drag to resize"></div>
    <section class="timeline-pane" id="timelinePane">
      <div class="timeline-head-wrap" id="timelineHeadWrap">
        <div class="timeline-head" id="timelineHead"></div>
        <button class="th-scroll-btn left" id="tlScrollLeft" title="Scroll left" aria-label="Scroll timeline left"><svg><use href="#i-chevron-left"/></svg></button>
        <button class="th-scroll-btn right" id="tlScrollRight" title="Scroll right" aria-label="Scroll timeline right"><svg><use href="#i-chevron-right"/></svg></button>
      </div>
      <div class="timeline-scroll" id="timelineScroll">
        <div class="timeline-canvas" id="timelineCanvas"></div>
      </div>
    </section>
  </main>

  <div class="tabbar">
    <div class="tabs" id="tabs"></div>
    <button class="tab-add" id="tabAdd" title="New project tab">+</button>
    <div class="tabbar-spacer"></div>
    <button class="tab-more" id="tabMore" title="Tab actions"><svg><use href="#i-chevron"/></svg></button>
  </div>
</div>

<div class="menu-layer" id="menuLayer"></div>
<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>
<input type="file" id="fileInput" accept=".dplan,.gxp,.json,.csv,.xlsx" hidden>

<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/samples.js"></script>
<script src="js/tauri.js"></script>
<script src="js/store.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/gantt.js"></script>
<script src="js/import.js"></script>
<script src="js/pdf.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
